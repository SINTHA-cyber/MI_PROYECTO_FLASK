<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Compra de pintura</title>

</head>

<body>

    <h1>Calculadora de compra de pintura</h1>

    <form method="POST">

        <label>Nombre del cliente:</label>

        <input type="text" name="nombre" required>

        <br><br>

        <label>Edad:</label>

        <input type="number" name="edad" min="1" required>

        <br><br>

        <label>Cantidad de tarros de pintura:</label>

        <input type="number" name="cantidad" min="1" required>

        <br><br>

        <button ty

        pe="submit">Calcular compra</button>

    </form>

    {% if nombre %}

        <h2>Resultado de la compra</h2>

        <p>Cliente: {{ nombre }}</p>

        <p>Total sin descuento: ${{ total }}</p>

        <p>Descuento: ${{ descuento }}</p>

        <p><strong>Total a pagar: ${{ total_pagar }}</strong></p>

    {% endif %}

    <br>

    <a href="/">Volver al menú principal</a>

</body>

</html>
